<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{TITLE}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════
   TOKENS
═══════════════════════════════════════════ */
:root {
  --bg:        #070d19;
  --bg2:       #0d1526;
  --panel:     #101b2e;
  --panel2:    #152035;
  --border:    #1e2d45;
  --border2:   #253650;
  --text:      #e2e8f4;
  --text2:     #7d94b5;
  --text3:     #4a607e;
  --accent:    #3b82f6;
  --accent-lo: rgba(59,130,246,.12);
  --accent-md: rgba(59,130,246,.25);
  --green:     #22c55e;
  --green-lo:  rgba(34,197,94,.12);
  --red:       #ef4444;
  --red-lo:    rgba(239,68,68,.12);
  --orange:    #f97316;
  --orange-lo: rgba(249,115,22,.12);
  --yellow:    #eab308;
  --yellow-lo: rgba(234,179,8,.12);
  --cyan:      #06b6d4;
  --cyan-lo:   rgba(6,182,212,.12);
  --purple:    #a855f7;
  --purple-lo: rgba(168,85,247,.12);
  --r4:  4px;
  --r6:  6px;
  --r8:  8px;
  --r12: 12px;
  --r16: 16px;
}
[data-theme="light"] {
  --bg:        #f0f4f8;
  --bg2:       #e4eaf2;
  --panel:     #ffffff;
  --panel2:    #f7f9fc;
  --border:    #d1dae8;
  --border2:   #b8c6d9;
  --text:      #0f1c2e;
  --text2:     #4a607e;
  --text3:     #8da4c0;
  --accent:    #2563eb;
  --accent-lo: rgba(37,99,235,.08);
  --accent-md: rgba(37,99,235,.2);
  --green:     #16a34a;
  --green-lo:  rgba(22,163,74,.1);
  --red:       #dc2626;
  --red-lo:    rgba(220,38,38,.1);
  --orange:    #ea580c;
  --orange-lo: rgba(234,88,12,.1);
  --yellow:    #ca8a04;
  --yellow-lo: rgba(202,138,4,.1);
  --cyan:      #0891b2;
  --cyan-lo:   rgba(8,145,178,.1);
  --purple:    #9333ea;
  --purple-lo: rgba(147,51,234,.1);
}

/* ═══════════════════════════════════════════
   RESET & BASE
═══════════════════════════════════════════ */
*,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Inter', system-ui, -apple-system, sans-serif;
  font-size: 14px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; text-decoration: none; }
::-webkit-scrollbar { width: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 99px; }

/* ═══════════════════════════════════════════
   TOPBAR
═══════════════════════════════════════════ */
.topbar {
  position: fixed; top: 0; left: 0; right: 0; z-index: 200;
  height: 52px;
  background: rgba(7,13,25,.88);
  backdrop-filter: blur(20px) saturate(160%);
  -webkit-backdrop-filter: blur(20px) saturate(160%);
  border-bottom: 1px solid var(--border);
}
[data-theme="light"] .topbar { background: rgba(240,244,248,.92); }
.topbar-inner {
  max-width: 1320px; margin: 0 auto; height: 100%;
  display: flex; align-items: center; gap: 12px; padding: 0 20px;
}

/* Brand */
.brand { display: flex; align-items: center; gap: 9px; flex-shrink: 0; }
.brand-logo {
  width: 30px; height: 30px; border-radius: var(--r8);
  background: linear-gradient(135deg,#1d4ed8,#7c3aed);
  display: flex; align-items: center; justify-content: center;
  font-size: 15px; flex-shrink: 0;
  box-shadow: 0 0 14px rgba(124,58,237,.4);
}
.brand-name { font-size: 15px; font-weight: 800; letter-spacing: -.3px; white-space: nowrap; }
.live-chip {
  display: flex; align-items: center; gap: 5px;
  background: var(--green-lo); border: 1px solid rgba(34,197,94,.35);
  border-radius: var(--r4); padding: 2px 7px;
  font-size: 10px; font-weight: 700; letter-spacing: .6px;
  color: var(--green); font-family: 'JetBrains Mono', monospace;
}
.live-dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--green); flex-shrink: 0;
  box-shadow: 0 0 6px var(--green);
  animation: livepulse 2s infinite;
}
@keyframes livepulse { 0%,100%{opacity:1} 50%{opacity:.4} }

.sep { width: 1px; height: 22px; background: var(--border); flex-shrink: 0; }

.meta-text {
  font-size: 11px; color: var(--text3);
  font-family: 'JetBrains Mono', monospace;
  white-space: nowrap; flex-shrink: 0;
}
.meta-refresh { color: var(--text2); }

/* Search */
.search-wrap { position: relative; flex: 1; max-width: 340px; }
.search-ico { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--text3); font-size: 13px; pointer-events: none; }
.search-input {
  width: 100%;
  background: var(--panel); border: 1px solid var(--border);
  border-radius: var(--r8); color: var(--text);
  font-family: 'Inter', sans-serif; font-size: 13px;
  padding: 7px 12px 7px 32px; outline: none;
  transition: border-color .15s, box-shadow .15s;
}
.search-input::placeholder { color: var(--text3); }
.search-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-lo); }

/* Source select */
.source-select {
  background: var(--panel); border: 1px solid var(--border);
  border-radius: var(--r8); color: var(--text);
  font-family: 'Inter', sans-serif; font-size: 13px;
  padding: 7px 10px; outline: none; cursor: pointer;
  max-width: 160px; flex-shrink: 0;
  transition: border-color .15s;
}
.source-select:focus { border-color: var(--accent); }

/* Icon buttons */
.icon-btn {
  display: flex; align-items: center; justify-content: center;
  width: 34px; height: 34px; border-radius: var(--r8);
  border: 1px solid var(--border); background: var(--panel);
  color: var(--text2); cursor: pointer; flex-shrink: 0;
  font-size: 15px; transition: background .15s, border-color .15s, color .15s;
}
.icon-btn:hover { background: var(--panel2); border-color: var(--border2); color: var(--text); }

/* ═══════════════════════════════════════════
   LAYOUT
═══════════════════════════════════════════ */
.layout {
  max-width: 1320px; margin: 0 auto;
  padding: 64px 20px 56px;
  display: grid;
  grid-template-columns: minmax(0,1fr) 268px;
  gap: 20px;
  align-items: start;
}

/* ═══════════════════════════════════════════
   SIDEBAR
═══════════════════════════════════════════ */
.sidebar {
  position: sticky; top: 64px;
  display: flex; flex-direction: column; gap: 14px;
}
.s-card {
  background: var(--panel); border: 1px solid var(--border);
  border-radius: var(--r12); overflow: hidden;
}
.s-head {
  padding: 11px 14px;
  font-size: 10px; font-weight: 700; letter-spacing: .9px;
  text-transform: uppercase; color: var(--text3);
  border-bottom: 1px solid var(--border);
}
.s-row {
  display: flex; align-items: center; justify-content: space-between;
  padding: 9px 14px; border-bottom: 1px solid var(--border);
  font-size: 13px;
}
.s-row:last-child { border-bottom: none; }
.s-label { color: var(--text2); }
.s-val { font-weight: 700; font-family: 'JetBrains Mono', monospace; }
.s-val.blue   { color: var(--accent); }
.s-val.red    { color: var(--red); }
.s-val.orange { color: var(--orange); }
.s-val.yellow { color: var(--yellow); }
.s-val.dim    { color: var(--text2); }

/* Keyword pills */
.kw-wrap { padding: 10px 12px; display: flex; flex-wrap: wrap; gap: 5px; }
.kw-pill {
  font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 500;
  padding: 3px 7px; border-radius: var(--r4);
  border: 1px solid var(--border); background: var(--panel2);
  color: var(--text3); cursor: pointer; user-select: none;
  transition: all .12s;
}
.kw-pill:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-lo); }
.kw-pill.active { border-color: var(--accent); color: var(--accent); background: var(--accent-lo); font-weight: 700; }

/* ═══════════════════════════════════════════
   FEED HEADER
═══════════════════════════════════════════ */
.feed-hd {
  display: flex; align-items: center; justify-content: space-between;
  padding-bottom: 14px; margin-bottom: 4px;
  border-bottom: 1px solid var(--border);
}
.feed-hd-title { font-size: 13px; font-weight: 700; color: var(--text2); letter-spacing: .3px; }
.feed-hd-count { font-size: 13px; font-family: 'JetBrains Mono', monospace; }
.feed-hd-count span { color: var(--accent); font-weight: 700; }

/* ═══════════════════════════════════════════
   DATE GROUP
═══════════════════════════════════════════ */
.date-group {
  display: flex; align-items: center; gap: 10px;
  margin: 20px 0 10px;
}
.date-group:first-child { margin-top: 12px; }
.date-label {
  font-size: 11px; font-weight: 700; letter-spacing: .7px;
  text-transform: uppercase; color: var(--text3);
  white-space: nowrap; flex-shrink: 0;
}
.date-line { flex: 1; height: 1px; background: var(--border); }

/* ═══════════════════════════════════════════
   CARD
═══════════════════════════════════════════ */
.card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--r12);
  padding: 14px 16px;
  margin-bottom: 7px;
  cursor: pointer;
  outline: none;
  transition: border-color .14s, background .14s, transform .1s, box-shadow .14s;
  position: relative;
}
.card:hover {
  border-color: var(--border2);
  background: var(--panel2);
  transform: translateY(-1px);
  box-shadow: 0 4px 20px rgba(0,0,0,.35);
}
.card:focus-visible { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-lo); }
.card:active { transform: translateY(0); }

/* severity stripe */
.card.sev-critical { border-left: 3px solid var(--red);    padding-left: 14px; }
.card.sev-high     { border-left: 3px solid var(--orange);  padding-left: 14px; }
.card.sev-medium   { border-left: 3px solid var(--yellow);  padding-left: 14px; }

/* card top row */
.card-top {
  display: flex; align-items: center; gap: 8px;
  flex-wrap: wrap; margin-bottom: 9px;
}
.src-badge {
  font-size: 10px; font-weight: 600;
  font-family: 'JetBrains Mono', monospace;
  padding: 2px 7px; border-radius: var(--r4);
  border: 1px solid var(--accent-md);
  background: var(--accent-lo); color: var(--accent);
  white-space: nowrap; flex-shrink: 0;
}
.card-date {
  font-size: 11px; color: var(--text3);
  font-family: 'JetBrains Mono', monospace;
  flex-shrink: 0;
}
.card-badges { display: flex; gap: 5px; flex-wrap: wrap; margin-left: auto; }

/* badge base */
.badge {
  font-size: 10px; font-weight: 700;
  font-family: 'JetBrains Mono', monospace;
  padding: 2px 6px; border-radius: var(--r4);
  border: 1px solid; white-space: nowrap;
}
.badge-new      { color: var(--green);  border-color: rgba(34,197,94,.5);  background: var(--green-lo);  animation: newglow 2s infinite; }
.badge-cve      { color: var(--purple); border-color: rgba(168,85,247,.5); background: var(--purple-lo); }
.badge-critical { color: var(--red);    border-color: rgba(239,68,68,.5);  background: var(--red-lo); }
.badge-high     { color: var(--orange); border-color: rgba(249,115,22,.5); background: var(--orange-lo); }
.badge-medium   { color: var(--yellow); border-color: rgba(234,179,8,.5);  background: var(--yellow-lo); }
.badge-actor    { color: var(--cyan);   border-color: rgba(6,182,212,.5);  background: var(--cyan-lo); font-size: 10px; }

@keyframes newglow { 0%,100%{opacity:1} 50%{opacity:.55} }

/* card title */
.card-title {
  font-size: 14px; font-weight: 600; line-height: 1.45;
  color: var(--text); margin-bottom: 6px;
}
.card:hover .card-title { color: #fff; }
[data-theme="light"] .card:hover .card-title { color: #000; }

/* actor tags */
.actor-row { display: flex; flex-wrap: wrap; gap: 5px; margin: 7px 0 4px; }

/* card footer */
.card-foot { display: flex; align-items: center; justify-content: flex-end; margin-top: 10px; }
.open-btn {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 11px; font-weight: 600; color: var(--text3);
  border: 1px solid var(--border); background: var(--bg2);
  padding: 4px 10px; border-radius: var(--r6);
  transition: color .12s, border-color .12s, background .12s;
}
.open-btn:hover { color: var(--accent); border-color: var(--accent); background: var(--accent-lo); }

/* ═══════════════════════════════════════════
   EMPTY STATE
═══════════════════════════════════════════ */
.empty { display: none; text-align: center; padding: 72px 24px; color: var(--text3); }
.empty-emoji { font-size: 40px; margin-bottom: 12px; }
.empty-msg { font-size: 14px; }

/* ═══════════════════════════════════════════
   FAB
═══════════════════════════════════════════ */
.fab {
  position: fixed; right: 18px; bottom: 18px; z-index: 300;
  width: 38px; height: 38px; border-radius: 50%;
  background: var(--panel2); border: 1px solid var(--border2);
  color: var(--text2); display: flex; align-items: center; justify-content: center;
  font-size: 16px; box-shadow: 0 4px 16px rgba(0,0,0,.4);
  opacity: 0; pointer-events: none; transform: translateY(8px);
  transition: opacity .18s, transform .18s, background .12s, color .12s;
}
.fab.show { opacity: 1; pointer-events: auto; transform: translateY(0); }
.fab:hover { background: var(--accent); color: #fff; border-color: var(--accent); }

/* ═══════════════════════════════════════════
   RESPONSIVE
═══════════════════════════════════════════ */
@media (max-width: 1024px) {
  .layout { grid-template-columns: minmax(0,1fr) 240px; gap: 16px; }
}
@media (max-width: 860px) {
  .layout { grid-template-columns: 1fr; }
  .sidebar { position: static; flex-direction: row; flex-wrap: wrap; }
  .s-card { flex: 1 1 280px; }
}
@media (max-width: 600px) {
  .topbar-inner { gap: 8px; padding: 0 14px; }
  .brand-name { font-size: 14px; }
  .live-chip { display: none; }
  .sep { display: none; }
  .meta-text { display: none; }
  .search-wrap { max-width: none; flex: 1; }
  .source-select { display: none; }
  .layout { padding: 60px 12px 48px; gap: 14px; }
  .sidebar { flex-direction: column; }
  .card { padding: 12px 14px; }
  .card.sev-critical,.card.sev-high,.card.sev-medium { padding-left: 12px; }
  .card-title { font-size: 13px; }
}
@media (max-width: 400px) {
  .brand-name { display: none; }
}
</style>
</head>
<body>

<!-- ━━━━ TOPBAR ━━━━ -->
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="brand-logo">🛡️</div>
      <span class="brand-name">{{TITLE}}</span>
      <div class="live-chip"><span class="live-dot"></span>LIVE</div>
    </div>

    <div class="sep"></div>
    <span class="meta-text">{{UPDATED}}</span>
    <span class="meta-text meta-refresh" id="refresh-txt"></span>

    <div class="search-wrap" style="margin-left:auto">
      <span class="search-ico">🔍</span>
      <input id="q" class="search-input" type="search" placeholder="Search CVE, APT, malware…" autocomplete="off" spellcheck="false">
    </div>

    <select id="source" class="source-select">
      <option value="">All sources</option>
    </select>

    <button id="btn-refresh" class="icon-btn" title="Refresh now">🔄</button>
    <button id="btn-theme"   class="icon-btn" title="Toggle theme" id="theme-btn">🌙</button>
  </div>
</header>

<!-- ━━━━ PAGE ━━━━ -->
<div class="layout">

  <!-- Feed -->
  <main>
    <div class="feed-hd">
      <span class="feed-hd-title">THREAT INTELLIGENCE FEED</span>
      <div class="feed-hd-count"><span id="count-lbl">{{COUNT}}</span> articles</div>
    </div>

    <div id="empty" class="empty">
      <div class="empty-emoji">🔎</div>
      <div class="empty-msg">No articles match your filters.</div>
    </div>

    <div id="list">{{ITEMS}}</div>
  </main>

  <!-- Sidebar -->
  <aside class="sidebar">

    <div class="s-card">
      <div class="s-head">Feed Status</div>
      <div class="s-row">
        <span class="s-label">Status</span>
        <span class="s-val" style="display:flex;align-items:center;gap:6px;color:var(--green)">
          <span class="live-dot"></span>Live
        </span>
      </div>
      <div class="s-row">
        <span class="s-label">Total</span>
        <span class="s-val blue" id="sb-total">{{COUNT}}</span>
      </div>
      <div class="s-row">
        <span class="s-label">Critical</span>
        <span class="s-val red"    id="sb-critical">—</span>
      </div>
      <div class="s-row">
        <span class="s-label">High</span>
        <span class="s-val orange" id="sb-high">—</span>
      </div>
      <div class="s-row">
        <span class="s-label">Medium</span>
        <span class="s-val yellow" id="sb-medium">—</span>
      </div>
      <div class="s-row">
        <span class="s-label">Sources</span>
        <span class="s-val dim"    id="sb-sources">—</span>
      </div>
    </div>

    <div class="s-card">
      <div class="s-head">Filter by Keyword</div>
      <div id="kw" class="kw-wrap">{{KEYWORDS}}</div>
    </div>

  </aside>
</div>

<a href="#" id="fab" class="fab" aria-label="Back to top">↑</a>

<script>
/* ── theme ── */
const html = document.documentElement;
const themeBtn = document.getElementById('btn-theme');
function applyTheme(t) {
  html.setAttribute('data-theme', t);
  themeBtn.textContent = t === 'dark' ? '☀️' : '🌙';
}
applyTheme(localStorage.getItem('theme') || 'dark');
themeBtn.addEventListener('click', () => {
  const t = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  localStorage.setItem('theme', t); applyTheme(t);
});

/* ── init cards ── */
const listEl  = document.getElementById('list');
const cards   = [...listEl.querySelectorAll('.card')];
const sources = new Set();
let crit=0, high=0, med=0;
cards.forEach(c => {
  if (c.dataset.source) sources.add(c.dataset.source);
  if (c.classList.contains('sev-critical')) crit++;
  else if (c.classList.contains('sev-high')) high++;
  else if (c.classList.contains('sev-medium')) med++;
});
document.getElementById('sb-critical').textContent = crit  || '—';
document.getElementById('sb-high').textContent     = high  || '—';
document.getElementById('sb-medium').textContent   = med   || '—';
document.getElementById('sb-sources').textContent  = sources.size;

const sel = document.getElementById('source');
[...sources].sort().forEach(s => {
  const o = document.createElement('option'); o.value = s; o.textContent = s; sel.appendChild(o);
});

/* ── click to open ── */
cards.forEach(c => {
  c.addEventListener('click', e => { if (e.target.closest('a')) return; if (c.dataset.link) window.open(c.dataset.link, '_blank', 'noopener'); });
  c.addEventListener('keydown', e => { if (e.key === 'Enter') { if (c.dataset.link) window.open(c.dataset.link, '_blank', 'noopener'); } });
});

/* ── date groups ── */
function sameDay(a,b){ return a.toDateString()===b.toDateString(); }
function dayLabel(d){
  const t=new Date(), y=new Date(); y.setDate(t.getDate()-1);
  if(sameDay(d,t)) return 'Today';
  if(sameDay(d,y)) return 'Yesterday';
  return d.toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'});
}
(function(){
  let last='';
  cards.forEach(c => {
    const d = new Date(c.dataset.date || Date.now());
    const lbl = dayLabel(d);
    if (lbl !== last) {
      const g = document.createElement('div'); g.className = 'date-group';
      g.innerHTML = `<span class="date-label">${lbl}</span><span class="date-line"></span>`;
      listEl.insertBefore(g, c); last = lbl;
    }
  });
})();

/* ── keyword pills ── */
const kwEl = document.getElementById('kw');
kwEl.querySelectorAll('.kw-pill').forEach(p => {
  p.dataset.k = p.textContent.trim().toLowerCase();
  p.addEventListener('click', () => { p.classList.toggle('active'); apply(); });
});

/* ── filter ── */
const qEl      = document.getElementById('q');
const emptyEl  = document.getElementById('empty');
const countLbl = document.getElementById('count-lbl');
function apply() {
  const query = qEl.value.trim().toLowerCase();
  const src   = sel.value;
  const tags  = [...kwEl.querySelectorAll('.kw-pill.active')].map(p => p.dataset.k);
  let vis = 0;
  cards.forEach(c => {
    const txt = (c.dataset.title || c.textContent || '').toLowerCase();
    const ok  = (!query || txt.includes(query))
             && (!src   || c.dataset.source === src)
             && (tags.length === 0 || tags.some(t => txt.includes(t)));
    c.style.display = ok ? '' : 'none';
    if (ok) vis++;
  });
  countLbl.textContent = vis;
  emptyEl.style.display = vis === 0 ? 'block' : 'none';
  document.querySelectorAll('.date-group').forEach(g => {
    let n = g.nextElementSibling, any = false;
    while (n && !n.classList.contains('date-group')) {
      if (n.style.display !== 'none') { any = true; break; }
      n = n.nextElementSibling;
    }
    g.style.display = any ? '' : 'none';
  });
}
qEl.addEventListener('input', apply);
sel.addEventListener('change', apply);
apply();

/* ── FAB ── */
const fab = document.getElementById('fab');
window.addEventListener('scroll', () => fab.classList.toggle('show', window.scrollY > 450), { passive: true });
fab.addEventListener('click', e => { e.preventDefault(); window.scrollTo({ top:0, behavior:'smooth' }); });

/* ── auto-refresh 30 min ── */
(function(){
  const TOTAL = 30 * 60 * 1000;
  const txtEl = document.getElementById('refresh-txt');
  let remain  = TOTAL;
  const tick = setInterval(() => {
    remain -= 1000;
    if (remain <= 0) { clearInterval(tick); txtEl.textContent = '· Refreshing…'; window.location.reload(); return; }
    const m = Math.floor(remain / 60000);
    const s = Math.floor((remain % 60000) / 1000).toString().padStart(2,'0');
    txtEl.textContent = `· refresh ${m}:${s}`;
  }, 1000);
  document.getElementById('btn-refresh').addEventListener('click', () => {
    clearInterval(tick); txtEl.textContent = '· Refreshing…'; window.location.reload();
  });
})();

/* ── keyboard shortcuts ── */
document.addEventListener('keydown', e => {
  if (e.key === '/' && document.activeElement !== qEl) { e.preventDefault(); qEl.focus(); }
  if (e.key === 'Escape') { qEl.value=''; apply(); qEl.blur(); }
});
</script>
</body>
